# lostOS model profile: Yandex Station 2 (the full-size 30 W speaker with the cloth cover), devicetree "yandex,station-midi", hostname Yandex-Station-gen2  (docs/models.md)
# Made from the probe of a REAL Station 2 (probe-station.sh + probe-profile.sh, 2026-10-28; quasar 3.21, Buildroot 2020.02.1, kernel 4.9.68 aarch64, 32-bit userland, 489 MB of RAM).
# NOT TESTED on a speaker with this daemon: check /tmp/lostos.log after the first start (the lines "input:", "leds:", "mixer:", "clock:").
codename=station-midi
host_prefix=yandex-station2-
friendly_name=Яндекс Станция 2
model_name=Yandex Station 2
# asound.conf: pcm "default" is asym: playback dmix_spk_plug, capture hw_feedback_and_mics = a route of 7 channels from hw:0,2 (PDM, 16 channels):
# out<-in 0<-0, 1<-2, 2<-4, 3<-7, 4<-8, 5<-9, 6<-6. quasar.cfg audiod: inRate 48000, micChannels 4, spkChannels 2, mainChannel vqe_0.
# TODO check with arecord that channels 0..3 are the microphones and 4,5 the loopback of the speaker (channel 6 is not described)
capture_pcm=default
capture_rate=48000
capture_channels=7
mic_channels=0,1,2,3
spk_channels=4,5
# quasar.cfg audiod/audioDevice/vqe/preset and counterActivationPresetName "Yandex yandexmidi"
vqe_preset=yandexmidi
# The only lights are the top panel: /dev/fb0 "YNDX LED screen" 89x1, 32 bpp, the bytes of a dot are R, G, B, 0; 84 dots are used (a flat matrix, hw/led_matrix.cpp).
# No sysfs LEDs (trigger "none"), no screen and no clock on this model.
led_prefix=station2
ring=84,0,/dev/fb0,YNDX LED screen,none,matrix,rgbw,89
# The ring of the Alice button: a GUESS, to be checked on the speaker. The framebuffer has 89 dots and the stock panel software uses 84; the other 5 (84..88) are taken for the
# button's ring (the stock firmware has a separate led config "oknix" next to "panel"). The daemon writes them together with the panel. If they light nothing, remove this line.
logo=5,0,/dev/fb0,YNDX LED screen,none,button,rgbw,89
clock_dir=/sys/class/leds/station2:white:clock
clock_seg_base=A
clock_pos_base=1
# input1 "midi_touch" (SPI touch pads: KEY_VOICECOMMAND 582 = the Alice button, KEY_VOLUMEUP 115, KEY_VOLUMEDOWN 114); input0 "gpio-keys" (SW_MUTE_DEVICE: the switch of the microphone)
keys_input=midi_touch
mute_input=gpio-keys
# TODO the error sound (ls /system/vendor/quasar/sounds/ru-RU) and the volume curve (quasar.cfg has no platformToAlsaMap: the curve of the Midi / Lite 2 is a guess)
error_sound=ru-RU/playback_error.opus
volume_map=0:0,1:49,20:255

# lostOS model profile: Yandex Station Lite (Micro), devicetree "yandex,station-micro"  (docs/models.md)
# Made from probe.txt / profile.txt of a real Station Micro v1.2 (quasar 3.21). NOT TESTED on the speaker yet:
# the fields marked (guess) are taken from the closest model (Lite 2, "plum"), check them in /tmp/lostos.log after the first start.
# Checked against the rootfs of the OTA 0.369.1.46 (2026-10-13) of the Micro: asound.conf, the VQE preset yandexmicro, no clock, leds/oknix, sounds/ru-RU/playback_error.opus.
# That firmware has no PCM "speakers": lostos adds it itself (plugins/asound_conf.h).
codename=station-micro
host_prefix=yandex-micro-
friendly_name=Яндекс Станция Лайт
model_name=Yandex Station Lite (Micro)
# stock asound.conf: pcm "default" = multi_capture = 4 microphones (PDM channels 0,2,4,6 of hw:0,1) + 2 loopback channels (hw:0,0)
capture_pcm=default
capture_rate=48000
capture_channels=6
mic_channels=0,1,2,3
spk_channels=4,5
vqe_preset=yandexmicro
# three RGB LEDs behind the framebuffer "YNDX LED ring" (3x1), sysfs micro:<red|green|blue>:ring1..3; the trigger name is a guess from the Lite 2
led_prefix=micro
ring=3,1,/dev/fb0,YNDX LED ring,led_ring_fb,ring
# no clock display on this speaker
clock_dir=
# touch pads sar0_pad0 (KEY_VOICECOMMAND, KEY_VOLUMEUP, KEY_VOLUMEDOWN); the mute is a KEY_MUTE button of gpio-keys-filter without a switch state
keys_input=sar0_pad0
mute_input=gpio-keys-filter
mute_key=1
error_sound=ru-RU/playback_error.opus
# quasar.cfg of the Micro has no platformToAlsaMap: the curve of the Midi / Lite 2 (guess)
volume_map=0:0,1:49,20:255

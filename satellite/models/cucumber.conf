# lostOS model profile: one key=value per line, '#' starts a comment (see docs/models.md)
codename=cucumber
host_prefix=yandex-midi-
friendly_name=Яндекс Станция Миди
model_name=Yandex Station Midi
capture_pcm=hw:0,2
capture_rate=96000
capture_channels=8
mic_channels=0,1,2,3
spk_channels=4,5,6,7
vqe_preset=cucumber
led_prefix=cucumber
ring=24,0,/dev/fb0,ring,ledfb-ring,ring
logo=6,0,/dev/fb1,logo,ledfb-logo,logo
clock_dir=/sys/class/leds/cucumber:white:clock-
clock_seg_base=a
clock_pos_base=1
clock_colon=p3,q3
clock_aux=deg,h1,h2,l1,l2,m1,m2,p1,p2,p4,p5,q1,q2,q4,q5
clock_chip_current=1
keys_input=awinic_sar
mute_input=mute

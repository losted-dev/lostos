# lostOS model profile: Yandex Station (1st generation), devicetree/board "tulip-d1", Allwinner R18, Android 6 (docs/platforms.md, "Станция 1")
# PARTIAL: tried on a speaker by hand (make ARCH=android), not installed by the installer yet; the LED ring is not checked by eye.
codename=tulip-d1
host_prefix=yandex-station-
friendly_name=Яндекс Станция
model_name=Yandex Station
# maind opens card 2 device 0 (snddaudio0, TDM0) as 5 ch S32_LE at 16 kHz, period 1024. Each 32-bit slot carries two 16-bit signals
# (measured 2026-10-28 with a test tone through the speaker): lanes 0..5 (slots 0..2, high and low half) and 7 (slot 3 low) are the
# 7 microphones; lane 6 (slot 3 high) is the electrical reference of the woofer amplifier (1 ms ahead of the mics), lanes 8, 9
# (slot 4) the tweeters' (nothing below 1..2 kHz). Which lane is which position in the array is NOT known yet; the order matters
# for the beamforming of the VQE.
capture_pcm=tinyalsa:2,0
capture_format=s32x2
capture_rate=16000
capture_channels=10
mic_channels=0,1,2,3,4,5,7
spk_channels=6,8,9,10,11
# The preset "yandexstation" (quasar.cfg audiod/audioDevice/vqe; input chunk 1024, processing frame 1024) expects 7 mics + 5 speaker
# references (logged by the daemon, 2026-10-28). The other 2 are the Loopback stream (quasar.cfg hdmiLoopback: card 4 device 1, 2 ch,
# 4 bytes, 48 kHz, period 3072): lanes 10, 11 after resampling to 16 kHz. The audio HAL (audio.primary.tulip.so) copies the output
# there only while it plays to HDMI (a TV has no electrical reference); through the speaker's own amplifiers they are silent, for
# maind too. The order of the 5 references the VQE expects is a GUESS (ADC ones first).
ref_pcm=tinyalsa:4,1
ref_format=s32
ref_rate=48000
ref_channels=2
vqe_preset=yandexstation
# Output: maind plays through openslessink (quasar.cfg mediad SINK "openslessink {sink_options}") into Android's AudioFlinger. The
# loudness is the codec (TAS5751) controls of card 1, "Tweeters/Subwoofer Master Playback Volume", which the audio HAL sets from its
# parameter hw_master_volume (percent) by its own table /system/etc/hardvol_ti.xml: percent -> dB per control (1 % -58.1 dB,
# 60 % -8.6 dB, 100 % +8.4 dB; the woofer 1 dB lower), dB -> value 0.125 dB a step. Mixer "hardvol" writes the same controls by the
# same table. quasar.cfg: volumeSelectionStrategy "percent", changeStepPercent 5 (20 levels), Alice's 1..10 = 10..100 %
# (volumeLevelSplsPercent); hence level n -> 5 n %.
audio_sink=openslessink
mixer=hardvol
hardvol=tinyalsa:1,/system/etc/hardvol_ti.xml
volume_map=0:0,1:5,20:100
# Keys: GPIOs, no input devices (maind keeps their sysfs value files open with edge "both"); names from the comments of
# /system/etc/rc.local. PH11 = gpio 235 KEY_FUNCTION (1 at rest, pressed = low), PB0/PB1 = gpio 32/33 INCREAS_CODE_KEY_2/1 (the
# volume wheel: 4 transitions per detent, clockwise = volume up), PB2 = gpio 34 TLV_MIC_EN_DET (flip-flop of the mute button, low
# = muted). All checked by hand on a speaker, 2026-10-29.
action_gpio=235,low
mute_gpio=34,low
wheel_gpio=32,33,4
# /system/vendor/quasar/sounds/ru-RU has playback_error.mp3 (as on the Lite 2 and Mini 3), no vins_error.wav.
error_sound=ru-RU/playback_error.mp3
# LEDs: a ring of 24 RGB LEDs on two SN3236 PWM drivers, /dev/i2c-0 at 0x3F (LEDs 1..12) and 0x3C (13..24): register layout from
# the vendor tools /system/bin/i2c_24led_onoff and i2c_24led_test (I2C_SLAVE 0x3f/0x3c, PWM G,R,B from 0x01, latch 0x25, control 0x26..).
# Both chips acknowledged writes on a speaker (2026-10-28). Which LED is the stock patterns' first one (the "home" position) and the
# direction round the ring are NOT checked by eye yet: LED 0 here = LED 1 of the vendor tool.
led_prefix=tulip
ring=24,0,/dev/i2c-0,0x3f+0x3c,none,ring,sn3236,0

# lostOS model profile: Yandex Station Mini 2, devicetree "yandex,station-mini2"  (docs/models.md)
# Made from a backup of the firmware of a real Mini 2 (quasar 3.21, build 4712742930) and from hackalice.me/devices/station-mini2.
# NOT TESTED on a speaker: check /tmp/lostos.log after the first start (the lines "input:", "leds:", "mixer:").
codename=station-mini2
host_prefix=yandex-mini2-
friendly_name=Яндекс Станция Мини 2
model_name=Yandex Station Mini 2
# stock asound.conf: pcm "default" captures through multi_capture = 4 microphones (PDM channels 0,2,4,6 of hw:0,1) + 2 loopback channels (hw:0,0), 48 kHz
capture_pcm=default
capture_rate=48000
capture_channels=6
mic_channels=0,1,2,3
spk_channels=4,5
# quasar.cfg audiod/audioDevice/vqe/preset
vqe_preset=yandexmini_2
# six RGB LEDs, sysfs mini2:<red|green|blue>:ring1..6 (IS31FL3236); the framebuffer line is a guess from the Lite 2 / Micro: without it lostos writes to sysfs
led_prefix=mini2
ring=6,1,/dev/fb0,YNDX LED ring,led_ring_fb,ring
# the clock: mini2:white:clock<A..G><1..4>, the colon is PLUS1 + PLUS2 (quasar.cfg leds/clock/frameBuilder symbolValues ':').
# There are Mini 2 with the clock display and without it: lostos looks for the LEDs and runs without a clock when there are none (log line "no clock display")
clock_dir=/sys/class/leds/mini2:white:clock
clock_seg_base=A
clock_pos_base=1
clock_colon=PLUS1,PLUS2
clock_aux=PLUS3,PLUS4,MINUS,DEGREE
clock_chip_current=0
# touch pads of the AW96103 sensor; the Mini 2 has no switch of the microphone that the firmware reads (maind keeps a file is_speaker_muted), "none" is not a device
keys_input=sar0_pad0
mute_input=none
error_sound=ru-RU/playback_error.opus
# no platformToAlsaMap in quasar.cfg: the curve of the Midi / Lite 2 (guess)
volume_map=0:0,1:49,20:255
